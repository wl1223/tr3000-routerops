[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tr3000-routerops"
version = "0.1.0"
description = "Safety-first AI network operations agent for Cudy TR3000 routers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai",
  "paramiko",
  "pydantic>=2",
  "pydantic-settings",
  "python-dotenv",
  "typer",
]

[project.optional-dependencies]
mcp = ["mcp"]
dev = [
  "hypothesis",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "types-paramiko",
]

[project.scripts]
routerops = "routerops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/routerops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["routerops"]

